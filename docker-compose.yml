services:
  postgres:
    image: postgres:17
    container_name: chess-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: chess
      POSTGRES_USER: chess_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chess_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - chess_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_user -d chess"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chess_data: